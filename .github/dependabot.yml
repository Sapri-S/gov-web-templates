# Weekly update pull requests for every dependency type in the repo.
version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/portal-api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/portal-web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
