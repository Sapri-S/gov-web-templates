name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  web:
    name: Frontend typecheck, tests (incl. accessibility) and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portal-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  wordpress:
    name: WordPress starter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PHP syntax
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: theme.json is valid JSON
        run: python3 -c "import json; json.load(open('wordpress/wp-content/themes/gov-starter/theme.json'))"

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/api.Dockerfile -t portal-api:ci .
      - run: docker build -f deploy/web.Dockerfile -t portal-web:ci .
